[tools]
uv = "latest"
python = "3.13"

[tasks.release]
description = "Start a release: bump version, test, build, open a PR against main"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ -z "${1:-}" ]; then
  echo "usage: mise run release <version>" >&2
  exit 1
fi
version="$1"
branch="release/v${version}"

git checkout main
git pull origin main
git checkout -b "$branch"

uv version "$version"
uv run pytest
rm -rf dist
uv build

git commit -am "Release v${version}"
git push -u origin "$branch"
gh pr create --title "Release v${version}" --base main --head "$branch" \
  --body "Release v${version}."

echo
echo "PR opened. Once it's reviewed and merged, .github/workflows/finish-release.yml"
echo "tags, builds, and publishes the release (and PyPI package) automatically."
'''
