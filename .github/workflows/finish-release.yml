name: Finish Release

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml

jobs:
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      is-new: ${{ steps.check.outputs.is-new }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install Python
        run: uv python install 3.13

      - name: Check whether this version has already been tagged
        id: check
        run: |
          version=$(uv version --short)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if git rev-parse "v${version}" >/dev/null 2>&1; then
            echo "is-new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is-new=true" >> "$GITHUB_OUTPUT"
          fi

  finish-release:
    needs: detect-version
    if: needs.detect-version.outputs.is-new == 'true'
    runs-on: ubuntu-latest
    # `release` carries RELEASE_PAT, which only the release-creation step uses:
    # a release created with the default GITHUB_TOKEN does not emit a
    # `release: published` event, so publish.yml would never fire.
    environment: release
    permissions:
      contents: write
    steps:
      # Deliberately checked out with the default job-scoped GITHUB_TOKEN.
      # Passing the PAT here would persist it in .git/config for every later
      # step, and the tag push does not need it: `protect-versions` restricts
      # deletion/non-fast-forward/update on refs/tags/v*, not creation.
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install Python
        run: uv python install 3.13

      - name: Build package
        run: uv build

      - name: Tag release
        run: |
          version="${{ needs.detect-version.outputs.version }}"
          git tag "v${version}"
          git push origin "v${version}"

      # Creating the release with RELEASE_PAT (not github.token) is what lets
      # publish.yml pick it up. This is the only step that needs the PAT. The
      # built artifacts are attached here and re-downloaded by publish.yml, so
      # PyPI gets these exact files.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          version="${{ needs.detect-version.outputs.version }}"
          gh release create "v${version}" dist/* --generate-notes
