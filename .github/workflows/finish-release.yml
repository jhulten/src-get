name: Finish Release

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml

jobs:
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      is-new: ${{ steps.check.outputs.is-new }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install Python
        run: uv python install 3.13

      - name: Check whether this version has already been tagged
        id: check
        run: |
          version=$(uv version --short)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if git rev-parse "v${version}" >/dev/null 2>&1; then
            echo "is-new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is-new=true" >> "$GITHUB_OUTPUT"
          fi

  finish-release:
    needs: detect-version
    if: needs.detect-version.outputs.is-new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install Python
        run: uv python install 3.13

      - name: Build package
        run: uv build

      - name: Tag release
        run: |
          version="${{ needs.detect-version.outputs.version }}"
          git tag "v${version}"
          git push origin "v${version}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.detect-version.outputs.version }}"
          gh release create "v${version}" dist/* --generate-notes

      - name: Upload built package for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  publish-pypi:
    needs: finish-release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download built package
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
